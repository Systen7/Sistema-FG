<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sistema Empresa FG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: preto e azul, tema único escuro. Títulos e números em serifa de alto contraste, texto em sem-serifa geométrica; linhas finas, cantos discretos, um brilho azul só nos painéis de foco. */
:root{
  --bg:#04060a; --surface:#0a0f18; --surface2:#101826; --ink:#eef2f9; --muted:#8a96ab; --line:#1b2538;
  --road:#060a12; --road2:#0e1626; --road3:#1d2a44; --road-ink:#eef2f9; --road-muted:#8a96ab;
  --y:#2a62f5; --yt:#7ea6ff; --y-ink:#ffffff; --y-soft:#0e1d42; --run-ink:#a9c4ff;
  --good:#5fd3a0; --good-soft:#0f2a20; --warn:#e8b45a; --warn-soft:#33270f; --bad:#ff7d7d; --bad-soft:#3a1717;
  --k1:#f2994a; --k2:#f2c94c; --k3:#c58f6a; --k4:#4fc3f7; --k5:#eb5757; --k6:#b388ff; --k7:#90a0b7; --k8:#3ddc97;
  --scrim:rgba(2,4,8,.72); --focus:#a9c4ff;
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --body:"Jost","Century Gothic","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:42px;line-height:1.02;letter-spacing:-.01em}
h2{font-size:23px} p{margin:0}
.num{font-variant-numeric:tabular-nums} .muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top :focus-visible,.nav :focus-visible,.hero :focus-visible,.dark :focus-visible{outline-color:var(--y)}

.top{border-bottom:1px solid var(--line);background:var(--road);color:var(--road-ink);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.16em;text-transform:uppercase}
.brand i{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--yt);color:var(--yt);font-style:normal;font-size:16px;letter-spacing:0}
.sp{flex:1}
.seg{display:inline-flex;background:var(--road2);border:1px solid var(--line);border-radius:3px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--road-muted);padding:7px 14px;border-radius:2px;cursor:pointer;font-weight:500;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--y);color:var(--y-ink)}
.top select{background:var(--road2);color:var(--road-ink);border:1px solid var(--road3);border-radius:6px;padding:7px 10px}
.demo{background:var(--y-soft);color:var(--run-ink);font-size:13px;padding:6px 16px;font-weight:500;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.demo button{border:0;background:transparent;text-decoration:underline;cursor:pointer;font-weight:600;color:inherit;padding:0}

.shell{display:grid;grid-template-columns:216px minmax(0,1fr);align-items:start}
.nav{border-right:1px solid var(--line);background:var(--road);padding:10px 8px 24px;display:flex;flex-direction:column;gap:2px;align-self:stretch;min-height:100vh}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;color:var(--road-muted);text-align:left;padding:10px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap}
.nav button:hover{color:var(--road-ink);background:var(--road2)}
.nav button[aria-current="page"]{background:var(--road2);color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--yt)}
.badge{background:var(--y);color:var(--y-ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.badge.r{background:var(--bad);color:#2a0808}
.main{padding:24px 24px 56px;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.head p{color:var(--muted);max-width:62ch;margin-top:6px}
.per{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.per button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.per button[aria-pressed="true"]{background:var(--y);color:var(--y-ink);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}

/* painel de pista */
.hero{background:radial-gradient(120% 150% at 100% 0%,#0f2760 0%,transparent 58%),var(--road);border:1px solid var(--road3);color:var(--road-ink);border-radius:4px;padding:26px 22px 20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--yt),transparent)}
.hero .lbl{color:var(--road-muted)}
.hero .top2{display:flex;flex-wrap:wrap;gap:18px 32px;justify-content:space-between;align-items:flex-end}
.big{font-family:var(--display);font-weight:500;font-size:clamp(50px,8.5vw,88px);line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums;color:var(--good);display:block;margin:6px 0 8px}
.big.neg{color:var(--bad)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:8px;flex:1 1 360px;max-width:560px}
.minis div{background:rgba(6,10,18,.55);border:1px solid var(--road3);border-radius:3px;padding:10px 12px;min-width:0}
.minis b{display:block;font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.minis span.small{color:var(--road-muted)}
.stack{display:flex;height:40px;gap:2px;border-radius:2px;overflow:hidden}
.stack button{border:0;padding:0;min-width:3px;cursor:pointer;transform-origin:left}
.stack.has button[aria-pressed="false"]{opacity:.3}
.stack button:hover{filter:brightness(1.15)}
.read{font-size:16px;min-height:1.5em} .read b{color:var(--yt);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:7px;border:1px solid var(--road3);background:transparent;color:var(--road-ink);border-radius:20px;padding:3px 11px;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums}
.legend button[aria-pressed="true"]{background:var(--road3)}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--road3);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child>td{border-bottom:0}
td.r,th.r{text-align:right} td.wrap{white-space:normal;min-width:200px}
tr.click{cursor:pointer} tr.click:hover>td{background:var(--surface2)}
tr.det>td{background:var(--surface2);white-space:normal}
.pos{color:var(--good);font-weight:600} .negv{color:var(--bad);font-weight:600}

.chip{display:inline-block;border-radius:2px;padding:1px 8px;font-size:12.5px;font-weight:500;letter-spacing:.02em;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.run{background:var(--y-soft);color:var(--run-ink)}
.plate{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:.06em;background:#fff;color:#111a17;border:1px solid #111a17;border-top:4px solid #1d4fa3;border-radius:3px;padding:0 6px;line-height:1.5}

.btn{border:1px solid var(--road3);background:var(--surface2);border-radius:3px;padding:7px 13px;cursor:pointer;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.btn:hover{border-color:var(--yt)}
.btn.pri{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:3px 10px;font-size:13px} .btn.big2{padding:15px;font-size:16px;width:100%;letter-spacing:.1em;text-transform:uppercase}
.btn.del{color:var(--bad)} .btn.ghost{background:transparent;border-color:var(--road3);color:var(--road-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{height:5px;background:var(--surface2);border-radius:4px;min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yt);transform-origin:left} .bar i.n{background:var(--bad)} .bar i.y{background:var(--y)}
.dark .bar{background:var(--road3)}

.list{display:flex;flex-direction:column}
.list>div{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list>div>span:first-child{min-width:0;flex:1 1 180px}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select{border:1px solid var(--road3);background:var(--bg);color:var(--ink);border-radius:3px;padding:9px;font-size:15px;width:100%;min-width:0}
.err{color:var(--bad);font-weight:600}

.rig{display:flex;flex-direction:column;gap:9px;align-items:center;padding:8px 0}
.axle{display:flex;align-items:center;gap:6px} .axle .shaft{width:64px;height:5px;background:var(--line)} .axle.gap{margin-top:16px}
.tyre{width:21px;height:46px;border-radius:5px;border:2px solid transparent;cursor:pointer;padding:0;background:var(--good)}
.tyre.warn{background:var(--warn)} .tyre.bad{background:var(--bad)}
.tyre:hover{transform:scale(1.1)} .tyre[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.16)}
.axn{width:74px;font-size:12px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair>div{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:9px 11px;min-width:0}
.pair b{display:block;font-family:var(--display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.dark .pair>div,.pair.dark>div{background:rgba(6,10,18,.55);border-color:var(--road3)}

.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.mods ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.mods li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* mapa */
.map{background:radial-gradient(90% 90% at 70% 20%,#0c1d47 0%,transparent 70%),var(--road);border:1px solid var(--road3);border-radius:4px;overflow:hidden;align-self:start}
.map svg{display:block;width:100%;height:auto}
.map .grid{stroke:var(--road2);stroke-width:1}
.map .rt{stroke:var(--road3);stroke-width:2;fill:none}
.map .trail{stroke:var(--yt);stroke-width:3;fill:none;stroke-dasharray:9 7}
.map .city{fill:var(--road-muted)} .map text{fill:var(--road-muted);font-size:13px;font-family:var(--body)}
.map text.pl{fill:var(--road-ink);font-weight:700;font-family:var(--mono);font-size:11px;paint-order:stroke;stroke:var(--road);stroke-width:3px}
.map .tk{cursor:pointer} .map .tk circle.c{fill:var(--road-ink);stroke:var(--road);stroke-width:2}
.map .tk.mov circle.c{fill:var(--yt)} .map .tk circle.s{stroke:none} .map .tk.sel circle.s{stroke:var(--yt);stroke-width:2}
.map .pulse{fill:var(--y);opacity:.25}
@media (prefers-reduced-motion:no-preference){ .map .pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{from{transform:scale(.6);opacity:.5}to{transform:scale(2.2);opacity:0}}
  .enter .stack button,.enter .bar i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both} @keyframes grow{from{transform:scaleX(0)}}
  .tyre,.btn{transition:transform .12s,border-color .12s,filter .12s} .dlg{animation:pop .16s ease-out} @keyframes pop{from{transform:translateY(8px);opacity:.4}} }
.tcard{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tcard[aria-pressed="true"]{border-color:var(--yt);background:var(--surface2)}

/* motorista */
.phone{max-width:480px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--y);color:var(--y-ink)}
.rtt{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.1}
.hero .list>div{border-color:var(--road3)} .hero label.f{color:var(--road-muted)}
.hero label.f input,.hero label.f select{background:rgba(4,6,10,.6);border-color:var(--road3);color:var(--road-ink)}
.chat{display:flex;flex-direction:column;gap:8px;height:380px;overflow-y:auto;background:var(--surface2);border-radius:8px;padding:12px}
.msg{max-width:84%;padding:8px 11px;border-radius:10px;white-space:pre-line;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--y-soft);color:var(--run-ink);border-color:transparent}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.login{max-width:440px;margin:0 auto;padding:40px 16px 56px;display:flex;flex-direction:column;gap:20px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.cats button{display:flex;flex-direction:column;gap:2px;text-align:left;background:rgba(6,10,18,.55);border:1px solid var(--road3);border-radius:3px;color:var(--road-ink);padding:11px 12px;cursor:pointer;min-width:0}
.cats button:hover{border-color:var(--yt)} .cats button[aria-pressed="true"]{border-color:var(--yt);background:var(--y-soft)}
.cats span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--road-muted)} .cats span.small{letter-spacing:0;text-transform:none}
.cats b{font-family:var(--display);font-weight:500;font-size:22px;font-variant-numeric:lining-nums}
.send{display:flex;gap:8px} .send input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 14px}

.ov{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--road3);border-radius:4px;border-top:1px solid var(--yt);padding:20px;width:min(100%,600px);max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--road);color:var(--road-ink);border:1px solid var(--yt);padding:10px 18px;border-radius:3px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;min-height:0;padding:6px 8px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--y)}
  .main{padding:16px 16px 48px} h1{font-size:34px} .hero{padding:22px 16px 16px}
  .minis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
}
</style>

<script>
const HOJE='2026-10-06', DIESEL=6.19, KEY='fg-v3';
const PERS=['drivers','trucks','trips','manut','apolices','fixos','pneus','lemb','cfg','sil','pagos','seq','uid','auth','adminPin'];
const MES={'2026-09':'Setembro 2026','2026-10':'Outubro 2026 (até dia 6)'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>(v<0?'−':'')+'R$ '+Math.abs(Math.round(v)).toLocaleString('pt-BR');
const N=(v,d=0)=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const D=s=>s?s.slice(8)+'/'+s.slice(5,7):'—';
const DF=s=>s?s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
const dias=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const mais=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const toNum=s=>{const v=parseFloat(String(s).replace(/[^\d,.]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(v)?null:v};

/* ---------- dados de exemplo ---------- */
const EIXOS=[['Direcional',1],['Tração 1',2],['Tração 2',2],['Carreta 1',2],['Carreta 2',2],['Carreta 3',2]];
function geraPneus(tid,novo){let i=0;const a=[];EIXOS.forEach(([n,per],ax)=>['Esquerdo','Direito'].forEach(lado=>{for(let k=0;k<per;k++){
  const sulco=novo?16:2+((tid*7+i*5)%13), rec=novo||!ax?0:((tid+i)%3), km=novo?0:(16-sulco)*9500+rec*60000;
  a.push({id:i,ax,eixo:n,lado,pos:per>1?(k?'interno':'externo'):'',sulco,rec,km,custo:2900+rec*780});i++}}));return a}
const fixT=d=>{const PC={1:'RLB8F45',2:'QTA3C18',3:'SFM6J02',4:'PKD1G73'};d.trucks.forEach(t=>{if(t.placaCarreta===undefined)t.placaCarreta=PC[t.id]||''});return d};
function seed(){
  const d={seq:100,uid:1000,sil:{},pagos:{},cfg:{dias:60,urg:20,kmRev:5000,sulco:3,retorno:60},
   lemb:[{id:901,txt:'Renovar contrato com a seguradora de carga',data:'2026-10-15'}],
   drivers:[{id:1,nome:'Valdir Nogueira',fone:'(66) 90000-0001',com:10,cnh:'2027-03-14',tox:'2026-11-02',truck:1},{id:2,nome:'Jeferson Prado',fone:'(64) 90000-0002',com:10,cnh:'2026-10-28',tox:'2028-01-20',truck:2},
    {id:3,nome:'Edmilson Carvalho',fone:'(66) 90000-0003',com:12,cnh:'2029-06-01',tox:'2027-08-15',truck:3},{id:4,nome:'Rogério Batista',fone:'(34) 90000-0004',com:10,cnh:'2028-02-09',tox:'2027-04-30',truck:4}],
   trucks:[{id:1,placa:'RKT4E21',mod:'Cavalo 6x4 + graneleira',ano:2021,km:404000,meta:2.4,rev:420000,tac:'2027-04-10',lic:'2027-06-30'},{id:2,placa:'QPM7B09',mod:'Cavalo 6x2 + graneleira',ano:2019,km:590000,meta:2.5,rev:600000,tac:'2027-01-22',lic:'2027-07-31'},

function calc(t){

  const litros=ok.reduce((a,e)=>a+(e.litros||0),0), com=t.frete*com0/100;
  const km=t.kmFim?t.kmFim-t.kmIni:null, cheio=km?km-t.kmVazio:null;
  const perd=km&&t.kmVazio&&cheio>0?t.kmVazio*(t.frete/cheio)*S.cfg.retorno/100*com0/100:0;

  return{total,diesel,ped,outros:total-diesel-ped,litros,com,km,perd,reemb,lucro:t.frete-total-com,media:km&&litros?km/litros:null};
}

  const ts=S.trips.filter(t=>t.status==='encerrada'&&t.ini.startsWith(per)&&f(t));
  const a={n:ts.length,frete:0,diesel:0,ped:0,outros:0,com:0,km:0,vazio:0,litros:0,perd:0,lucroV:0};

const XY=(la,lo)=>[(lo+58)/16*600+20,(-la-11)/16*480+20];
const ll=n=>{const k=String(n).split('/')[0].trim().toLowerCase(),c=CIDS.find(x=>x[0].toLowerCase()===k);return c?[c[1],c[2]]:null};
const geo=n=>{const c=ll(n);return c?XY(c[0],c[1]):null};
function kmEntre(a,b){const p=ll(a),q=ll(b);if(!p||!q)return 0;const r=x=>x*Math.PI/180,h=Math.sin(r(q[0]-p[0])/2)**2+Math.cos(r(p[0]))*Math.cos(r(q[0]))*Math.sin(r(q[1]-p[1])/2)**2;return 6371*2*Math.asin(Math.sqrt(h))*1.25}

    return{t,mov:1,p,a,x:a[0]+(b[0]-a[0])*p,y:a[1]+(b[1]-a[1])*p,rest:Math.round(kmEntre(t.orig,t.dest)*(1-p)),vel:76+Math.round(7*Math.sin(tick/2+tr.id))}}

   ${ts.map(t=>{const c=calc(t),meta=trk(t.truck)?.meta??0;return`<section class="panel"><header><b>${esc(t.orig)} → ${esc(t.dest)}</b><span class="small muted">${D(t.ini)} a ${D(t.fim)}</span></header>
    <p class="small muted">${esc(t.carga)} · ${N(c.km)} km${t.kmVazio?' ('+N(t.kmVazio)+' vazio)':''}${c.media?' · '+N(c.media,2)+' km/l'+(c.media<meta?' <span class="chip warn">meta '+N(meta,1)+'</span>':''):''}</p>
    <div class="list"><div><span>Frete</span><b class="num">${R(t.frete)}</b></div><div><span>Sua comissão (${N(d.com,1)}%)</span><b class="num pos">${R(c.com)}</b></div>${c.perd?`<div><span>Deixou de ganhar</span><b class="num" style="color:var(--warn)">${R(c.perd)}</b></div>`:''}<div><span>Combustível${c.litros?' · '+N(c.litros)+' L':''}</span><span class="num">${R(c.diesel)}</span></div><div><span>Pedágio</span><span class="num">${R(c.ped)}</span></div><div><span>Outros gastos</span><span class="num">${R(c.outros)}</span></div><div><span>Adiantamento recebido</span><span class="num">${R(t.adi)}</span></div></div></section>`}).join('')||'<p class="muted">Nenhuma viagem encerrada neste período.</p>'}`;
}
function zapOf(id){return S.zap[id]||(S.zap[id]={step:null,tmp:{},msgs:[{b:1,t:'Olá! Sou o assistente da empresa. O que você quer fazer?\n1 Iniciar viagem\n2 Lançar despesa\n3 Encerrar viagem\n4 Meu extrato'}]})}
function mZap(){
  const z=zapOf(S.me),q=z.step==='dtipo'?['Combustível','Pedágio','Alimentação','Borracharia','Outros']:z.step==='dpago'?['Empresa','Do meu bolso']:z.step?['Cancelar']:['Iniciar viagem','Lançar despesa','Encerrar viagem','Meu extrato'];
  return`<div><h1>Pelo WhatsApp</h1><p class="muted" style="margin-top:6px">Simulação: o motorista conversa com o número da empresa e o sistema registra tudo. O que for lançado aqui aparece no painel do administrador.</p></div>
   <div class="chat" id="chat">${z.msgs.map(m=>`<div class="msg ${m.b?'':'me'}">${esc(m.t)}</div>`).join('')}</div>
   <div class="quick">${q.map(x=>`<button class="btn sm" data-act="zq" data-v="${x}">${x}</button>`).join('')}</div>
   <form class="send" data-form="zap"><input id="z-in" name="t" autocomplete="off" placeholder="Digite uma mensagem" aria-label="Mensagem"><button class="btn pri">Enviar</button></form>`;
}
function zapIn(txt){
  const z=zapOf(S.me),d=drv(S.me),tr=trk(d.truck),s=txt.trim(),l=s.toLowerCase(),bot=t=>z.msgs.push({b:1,t});
  if(!s)return;z.msgs.push({t:s});const act=ativa(d.id);
  if(l==='cancelar'){z.step=null;return bot('Cancelado. Envie 1, 2, 3 ou 4 quando quiser.')}
  switch(z.step){
   case'orig':z.tmp.orig=s;z.step='dest';return bot('Qual a cidade de destino?');
   case'dest':z.tmp.dest=s;z.step='carga';return bot('Qual a carga? Ex.: soja 37 t');
   case'carga':z.tmp.carga=s;z.step='km';return bot('Qual o km do veículo agora? O último registrado é '+N(tr.km)+'.');
   case'km':{const v=toNum(s);if(!v||v<tr.km)return bot('O km precisa ser igual ou maior que '+N(tr.km)+'. Envie só o número.');z.tmp.kmIni=v;z.step='frete';return bot('Qual o valor do frete em reais?')}
   case'frete':{const v=toNum(s);if(!v)return bot('Não entendi o valor. Envie só o número, por exemplo 12500.');const t=novaViagem({...z.tmp,frete:v,ini:HOJE},d);z.step=null;return bot('Viagem '+t.id+' iniciada.\n'+t.orig+' → '+t.dest+'\nFrete '+R(v)+'\nSua comissão: '+R(v*d.com/100)+'\nBoa viagem!')}
   case'dtipo':z.tmp.tipo=l.startsWith('comb')?'Diesel':TIPOS.find(x=>x.toLowerCase().startsWith(l.slice(0,4)))||s;z.step='dvalor';return bot('Qual o valor em reais?');
   case'dvalor':{const v=toNum(s);if(!v)return bot('Não entendi o valor. Envie só o número.');z.tmp.valor=v;if(z.tmp.tipo==='Diesel'){z.step='dlit';return bot('Quantos litros abasteceu?')}z.step='dpago';return bot('Quem pagou? Empresa (cartão ou tag) ou do seu bolso?')}
   case'dlit':{const v=toNum(s);if(!v)return bot('Envie só o número de litros.');z.tmp.litros=v;z.step='dpago';return bot('Quem pagou? Empresa (cartão ou tag) ou do seu bolso?')}
   case'dpago':act.desp.push({id:uid(),tipo:z.tmp.tipo,valor:z.tmp.valor,litros:z.tmp.litros||null,data:HOJE,pago:l.startsWith('emp')?'empresa':'motorista',status:'pendente'});z.step=null;return bot(tl(z.tmp.tipo)+' de '+R(z.tmp.valor)+(z.tmp.litros?' ('+N(z.tmp.litros)+' L)':'')+' registrado na viagem '+act.id+'. Envie a foto do comprovante por aqui. Aguardando aprovação.');
   case'kmfim':{const v=toNum(s);if(!v||v<=act.kmIni)return bot('O km final precisa ser maior que '+N(act.kmIni)+'.');z.tmp.kmFim=v;z.step='vazio';return bot('Quantos km rodou vazio nessa viagem? Envie 0 se nenhum.')}
   case'vazio':{const v=toNum(s)||0,km=z.tmp.kmFim-act.kmIni;if(v>=km)return bot('O km vazio precisa ser menor que os '+N(km)+' km da viagem.');encerra(act,z.tmp.kmFim,v,HOJE);z.step=null;const c=calc(act);return bot('Viagem '+act.id+' encerrada.\n'+N(c.km)+' km rodados\nSua comissão: '+R(c.com))}
  }
  z.tmp={};
  if(/^1$|inici/.test(l)){if(act)return bot('Você já tem a viagem '+act.id+' em andamento. Encerre antes de iniciar outra.');if(!tr)return bot('Você está sem caminhão cadastrado. Fale com o escritório.');z.step='orig';return bot('Qual a cidade de origem?')}
  if(/^2$|desp/.test(l)){if(!act)return bot('Você não tem viagem em andamento. Envie 1 para iniciar.');z.step='dtipo';return bot('Qual o tipo da despesa?')}
  if(/^3$|encerr/.test(l)){if(!act)return bot('Você não tem viagem em andamento.');z.step='kmfim';return bot('Qual o km final? O inicial foi '+N(act.kmIni)+'.')}
  if(/^4$|extra/.test(l)){const a=agg(HOJE.slice(0,7),x=>x.driver===d.id);return bot('Outubro até agora:\n'+a.n+' fretes encerrados\nComissão ganha: '+R(a.com)+'\nDeixou de ganhar: '+R(a.perd)+(act?'\nViagem '+act.id+' em andamento.':''))}
  bot('Envie:\n1 Iniciar viagem\n2 Lançar despesa\n3 Encerrar viagem\n4 Meu extrato');
}
function novaViagem(f,d){const t={id:++S.seq,driver:d.id,truck:d.truck,orig:f.orig,dest:f.dest,ini:f.ini,fim:null,carga:f.carga,frete:f.frete,kmIni:f.kmIni,kmFim:null,kmVazio:0,adi:0,status:'andamento',desp:[]};S.trips.push(t);trk(d.truck).km=f.kmIni;return t}
function encerra(t,kmFim,vazio,fim){t.kmFim=kmFim;t.kmVazio=vazio;t.fim=fim;t.status='encerrada';const k=trk(t.truck);if(k)k.km=kmFim}

/* ---------- moldura e eventos ---------- */
function loginView(){
  const m=S.lgTab==='motorista';
  return`<main class="login"><div class="brand" style="justify-content:center"><i>FG</i>Sistema Empresa FG</div>
   <section class="hero"><h1 style="font-size:34px">Entrar</h1>
    <div class="tabs" style="grid-template-columns:1fr 1fr"><button data-act="lgtab" data-v="motorista" aria-pressed="${m}">Motorista</button><button data-act="lgtab" data-v="admin" aria-pressed="${!m}">Administrador</button></div>
    <form class="grid" data-form="login" style="grid-template-columns:minmax(0,1fr)">
     ${m?`<label class="f">Usuário<input id="l-user" name="user" autocomplete="username" autocapitalize="none" required></label><label class="f">PIN de 4 dígitos<input id="l-pin" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required></label>`
       :`<label class="f">Senha do administrador<input id="l-pin" name="pin" type="password" autocomplete="current-password" required></label>`}
     <button class="btn big2 pri">Entrar</button></form>
    ${S.lgErr?`<p class="err">${S.lgErr}</p>`:''}</section>
   <section class="panel"><span class="lbl">Acessos de exemplo para testar</span><div class="list">
     <div><span>Administrador <span class="small muted">senha ${esc(S.adminPin)}</span></span><button class="btn sm" data-act="demo" data-v="admin">Entrar</button></div>
     ${S.drivers.map(d=>`<div><span>${esc(d.nome)} <span class="small muted">usuário ${esc(d.usuario)} · PIN ${esc(d.pin)}</span></span><button class="btn sm" data-act="demo" data-v="${d.id}">Entrar</button></div>`).join('')}</div>
    <p class="small muted">Esta lista só existe no protótipo. No sistema definitivo cada motorista recebe o próprio usuário e PIN, e o servidor só entrega a ele as viagens dele.</p></section></main>`;
}
function render(anim){
  if(!S.auth||(S.auth.id&&!drv(S.auth.id))){S.auth=null;$('#app').innerHTML=loginView();$('#modal').innerHTML='';return}
  if(!drv(S.me))S.me=S.drivers[0].id;
  const adm=S.role==='admin',np=pend().length,nu=alertas().filter(x=>x.urg).length;
  const pg={painel:pgPainel,gps:pgGps,viagens:pgViagens,alertas:pgAlertas,motoristas:pgMotoristas,acerto:pgAcerto,frota:pgFrota,pneus:pgPneus,seguros:pgSeguros,rotas:pgRotas,checkup:pgCheckup};
  const bd={viagens:np?`<span class="badge">${np}</span>`:'',alertas:nu?`<span class="badge r">${nu}</span>`:''};
  $('#app').innerHTML=`<div class="top"><div class="brand"><i>FG</i>Sistema Empresa FG</div><span class="sp"></span>
    <span class="small" style="color:var(--road-muted)">${adm?'Administrador':esc(drv(S.me).nome)}</span><button class="btn sm" data-act="sair">Sair</button></div>
   <div class="demo"><span>Protótipo com dados de exemplo. O login aqui é uma demonstração: a proteção real dos dados vem com o banco de dados do sistema definitivo.</span>${adm?`<button data-act="reset">${S.rst?'Confirmar: apagar alterações':'Restaurar dados de exemplo'}</button>`:''}</div>
   ${adm?`<div class="shell"><nav class="nav" aria-label="Menu">${PAGES.map(p=>`<button data-act="page" data-v="${p[0]}" ${S.page===p[0]?'aria-current="page"':''}>${p[1]}${bd[p[0]]||''}</button>`).join('')}</nav><main class="main ${anim?'enter':''}">${pg[S.page]()}</main></div>`
   :`<main class="phone"><div class="tabs">${[['inicio','Viagem'],['extrato','Extrato'],['zap','WhatsApp']].map(t=>`<button data-act="mtab" data-v="${t[0]}" aria-pressed="${S.mtab===t[0]}">${t[1]}</button>`).join('')}</div>${{inicio:mInicio,extrato:mExtrato,zap:mZap}[S.mtab]()}</main>`}`;
  $('#modal').innerHTML=modal();
  const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;
  if(anim)anima();
}
function anima(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('[data-n]').forEach(el=>{const v=+el.dataset.n,txt=el.textContent,f=el.dataset.f==='N'?N:R,t0=performance.now();
   const step=now=>{const p=Math.min(1,(now-t0)/650),e=1-Math.pow(1-p,3);el.textContent=p<1?f(v*e):txt;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
const findDesp=id=>{for(const t of S.trips){const e=t.desp.find(x=>x.id==id);if(e)return e}};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='fecha'){if(e.target!==b)return;S.ed=null}
  else if(a==='fecha2')S.ed=null;
  S.formErr='';if(a!=='reset')S.rst=false;let anim=false;
  if(a==='lgtab'){S.lgTab=v;S.lgErr=''}
  else if(a==='demo'){entra(v==='admin'?{role:'admin'}:{role:'motorista',id:+v});anim=true}
  else if(a==='sair'){S.auth=null;S.ed=null;S.lgErr=''}
  else if(a==='dedit'){const x=findDesp(b.dataset.id);S.dEdit=x.id;S.showDesp=CATS.slice(0,5).some(c=>c[0]===x.tipo)?x.tipo:'Outros';S.showFim=false}
  else if(a==='dcancel'){S.dEdit=null;S.showDesp=false}
  else if(a==='ddel'){const t=ativa(S.me),x=t.desp.findIndex(e=>e.id===S.dEdit);if(x>=0)t.desp.splice(x,1);S.dEdit=null;S.showDesp=false;toast('Lançamento excluído')}
  else if(a==='page'){S.page=v;S.open=null;S.seg=null;anim=true}
  else if(a==='per'){S.per=v;S.seg=null;anim=true}
  else if(a==='mtab'){S.mtab=v;anim=true}
  else if(a==='open')S.open=S.open==b.dataset.t?null:+b.dataset.t;
  else if(a==='aprova'||a==='recusa'){findDesp(b.dataset.id).status=a==='aprova'?'aprovada':'recusada';toast(a==='aprova'?'Despesa aprovada':'Despesa recusada')}
  else if(a==='pagar'){const k=b.dataset.k;if(S.pagos[k])delete S.pagos[k];else{S.pagos[k]=1;toast('Acerto marcado como pago')}}
  else if(a==='pneu')S.pneuSel=S.pneuSel==b.dataset.i?null:+b.dataset.i;
  else if(a==='troca'){const p=S.pneus[S.pneuTruck].find(x=>x.id===S.pneuSel);Object.assign(p,{sulco:16,rec:0,km:0,custo:2900});toast('Pneu novo registrado')}
  else if(a==='cat'){S.showDesp=S.showDesp===v&&!S.dEdit?false:v;S.dEdit=null;S.showFim=false}
  else if(a==='tog'){const k=b.dataset.k,on=!S[k];S.showDesp=S.showFim=false;S.dEdit=null;S[k]=on}
  else if(a==='zq')zapIn(v);
  else if(a==='seg')S.seg=S.seg==v?null:+v;
  else if(a==='gps')S.gpsSel=S.gpsSel==v?null:+v;
  else if(a==='vpneus'){S.page='pneus';S.pneuTruck=+v;S.pneuSel=null;anim=true}
  else if(a==='sil'){S.sil[v]=1;toast('Alerta dispensado')}
  else if(a==='resil'){S.sil={};toast('Alertas restaurados')}
  else if(a==='ed')S.ed={tipo:b.dataset.tipo,id:+b.dataset.id,parent:b.dataset.parent||null};
  else if(a==='novo')S.ed={tipo:b.dataset.tipo,id:null,parent:b.dataset.parent||null};
  else if(a==='del'){const ed=S.ed,sc=SC[ed.tipo],arr=lista(ed),o=arr.find(x=>x.id==ed.id),tv=sc.trava&&sc.trava(o);
    if(tv)ed.err=tv;else if(!ed.conf)ed.conf=true;else{arr.splice(arr.indexOf(o),1);S.ed=null;toast('Excluído')}}
  else if(a==='reset'){if(!S.rst)S.rst=true;else{Object.assign(S,seed(),{rst:false,zap:{},ed:null,open:null,auth:S.auth});toast('Dados de exemplo restaurados')}}
  render(anim);save();
  if(a==='zq'){const i=$('#z-in');if(i)i.focus()}
  if(a==='dedit'){const f=$('[data-form="desp"]');if(f)f.scrollIntoView({block:'center'})}
  if(a==='ed'||a==='novo'){const i=$('#modal input,#modal select');if(i)i.focus()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ed){S.ed=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click,.tk')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('input',e=>{if(e.target.id==='d-litros'||e.target.id==='d-preco'){const l=toNum($('#d-litros').value),p=toNum($('#d-preco').value);if(l&&p)$('#d-valor').value=(l*p).toFixed(2).replace('.',',')}});
document.addEventListener('change',e=>{
  const c=e.target.dataset.chg;if(!c)return;const v=e.target.value;
  if(c==='me'){S.me=+v;S.showDesp=S.showFim=false}
  else if(c==='fstatus')S.fStatus=v;
  else if(c==='pneutruck'){S.pneuTruck=+v;S.pneuSel=null}
  render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),k=e.target.dataset.form,d=drv(S.me);S.formErr='';
  if(k==='login'){if(S.lgTab==='admin'){if(f.pin===S.adminPin)entra({role:'admin'});else S.lgErr='Senha incorreta.'}
    else{const u=(f.user||'').trim().toLowerCase(),x=S.drivers.find(x=>(x.usuario||'').toLowerCase()===u&&x.pin===f.pin);if(x)entra({role:'motorista',id:x.id});else S.lgErr='Usuário ou PIN incorretos.'}
    render(true);save();return}
  else if(k==='senha'){const n=(f.nova||'').trim();if(n.length<4)S.formErr='A senha precisa de pelo menos 4 caracteres.';else{S.adminPin=n;toast('Senha do administrador alterada')}}
  else if(k==='zap')zapIn(f.t);
  else if(k==='ed')salvaEd(f);
  else if(k==='cfg'){const o={};for(const x of['dias','urg','kmRev','sulco','retorno']){const n=toNum(f[x]);if(n===null||n<0){S.formErr='Preencha todas as regras com números.';break}o[x]=n}
    if(!S.formErr){if(o.urg>o.dias)S.formErr='O prazo urgente precisa ser menor ou igual ao prazo de aviso.';else{S.cfg=o;toast('Regras salvas')}}}
  else if(k==='nova'){const km=toNum(f.kmIni),fr=toNum(f.frete),tr=trk(d.truck);
    if(!tr)S.formErr='Você está sem caminhão cadastrado.';
    else if(!km||km<tr.km)S.formErr='O km do veículo precisa ser igual ou maior que '+N(tr.km)+', o último registrado.';
    else if(!fr)S.formErr='Informe o valor do frete em reais.';
    else{novaViagem({...f,kmIni:km,frete:fr},d);toast('Viagem iniciada')}}
  else if(k==='desp'){const t0=ativa(d.id),x=S.dEdit?t0.desp.find(e=>e.id===S.dEdit):null,tp=x?x.tipo:S.showDesp,v=toNum(f.valor),l=toNum(f.litros);if(!v)S.formErr='Informe o valor.';else if(tp==='Diesel'&&!l)S.formErr='Informe os litros abastecidos.';else if(x){Object.assign(x,{valor:v,litros:tp==='Diesel'?l:null,obs:(f.obs||'').trim(),kmAb:toNum(f.kmAb),pago:f.pago,status:'pendente'});S.dEdit=null;S.showDesp=false;toast('Alteração enviada para aprovação')}else{ativa(d.id).desp.push({id:uid(),tipo:tp,valor:v,litros:tp==='Diesel'?l:null,obs:(f.obs||'').trim(),kmAb:toNum(f.kmAb),data:HOJE,pago:f.pago,status:'pendente'});S.showDesp=false;toast(tl(tp)+': enviado para aprovação')}}
  else if(k==='fim'){const t=ativa(d.id),km=toNum(f.kmFim),vz=toNum(f.vazio)||0;
    if(!km||km<=t.kmIni)S.formErr='O km final precisa ser maior que o km inicial ('+N(t.kmIni)+').';
    else if(vz>=km-t.kmIni)S.formErr='O km vazio precisa ser menor que o total rodado.';
    else if(f.fim<t.ini)S.formErr='A chegada não pode ser antes do início da viagem.';
    else{encerra(t,km,vz,f.fim);S.showFim=false;toast('Viagem encerrada')}}
  render();save();if(k==='zap'){const i=$('#z-in');if(i)i.focus()}
});
setInterval(()=>{tick++;S.trips.forEach(t=>{if(t.status==='andamento'&&t.gps!=null)t.gps=Math.min(.97,t.gps+.0012)});
  const g=$('#gpsbox');if(g&&!S.ed&&!g.contains(document.activeElement))g.innerHTML=gpsBox()},2000);
render(true);
</script>
